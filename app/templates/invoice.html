<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #f5f5f5;
        }

        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>FACTURE</h1>

    <p>
        Numéro:
        {{ invoice.invoice_number }}
    </p>

    <p>
        Client:
        {{ invoice.client.name }}
    </p>

    <table>

        <thead>
            <tr>
                <th>Description</th>
                <th>Qté</th>
                <th>Prix</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>

            {% for item in invoice.items %}

            <tr>
                <td>{{ item.description }}</td>

                <td>{{ item.quantity }}</td>

                <td>{{ item.unit_price }}</td>

                <td>{{ item.total_price }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <div class="total">
        Total:
        {{ invoice.total_amount }} FCFA
    </div>

</body>

</html>
